<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打工人摸鱼考勤记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 左侧游戏主区域 -->
        <div class="main-panel">
            <!-- 顶部状态栏 -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-icon">⏰</span>
                    <div class="status-details">
                        <span class="status-label">工作时间</span>
                        <span class="status-value" id="gameTime">09:00</span>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-icon">☕</span>
                    <div class="status-details">
                        <span class="status-label">摸鱼精力</span>
                        <div class="progress-bar-container">
                            <div class="progress-bar energy-bar" id="energyBar" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-icon">👀</span>
                    <div class="status-details">
                        <span class="status-label">老板警戒度</span>
                        <div class="progress-bar-container">
                            <div class="progress-bar boss-bar" id="bossBar" style="width: 20%;"></div>
                        </div>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-icon">💰</span>
                    <div class="status-details">
                        <span class="status-label">薪资收益</span>
                        <span class="status-value" id="moneyValue">￥0</span>
                    </div>
                </div>
            </div>

            <!-- 游戏场景/办公室区域 -->
            <div class="office-area" id="officeArea">
                <!-- 老板视线提示 -->
                <div class="boss-alert" id="bossAlert">⚠️ 老板正在巡视中...</div>
                
                <!-- 场景角色与交互物 -->
                <div class="desk">
                    <div class="computer" id="computerBtn">
                        <div class="screen" id="screenContent">👩‍💻 假装打字</div>
                    </div>
                    <div class="mug" id="coffeeBtn" title="喝咖啡恢复精力">☕</div>
                    <div class="phone" id="phoneBtn" title="刷手机摸鱼">📱</div>
                    <div class="documents" id="workBtn" title="假装整理文件">📁</div>
                </div>

                <!-- 消息日志区 -->
                <div class="log-panel" id="logPanel">
                    <div class="log-item info">💡 游戏开始！9:00准时上班，努力摸鱼并赶在18:00下班！</div>
                </div>
            </div>

            <!-- 底部操作按钮 -->
            <div class="action-bar">
                <button class="btn btn-primary" id="actWork">📁 认真工作 (-10精力, -15警戒)</button>
                <button class="btn btn-success" id="actFish">📱 偷懒摸鱼 (+20金币, +15警戒)</button>
                <button class="btn btn-warning" id="actCoffee">☕ 喝杯咖啡 (+30精力, +5警戒)</button>
                <button class="btn btn-danger" id="actRest">💤 闭目养神 (+15精力, -5警戒)</button>
            </div>
        </div>

        <!-- 右侧面板：物品栏 + 摸鱼考勤历 -->
        <div class="sidebar-container">
            <!-- 1. 物品栏卡片 -->
            <div class="inventory-card">
                <div class="inventory-title">🎒 背包物品</div>
                <div class="inventory-grid" id="inventorySlots">
                    <div class="slot" title="降噪耳机 (已装备)">🎧</div>
                    <div class="slot" title="防窥页纸">📄</div>
                    <div class="slot" title="薄荷糖">🍬</div>
                    <div class="slot empty"></div>
                    <div class="slot empty"></div>
                    <div class="slot empty"></div>
                    <div class="slot empty"></div>
                    <div class="slot empty"></div>
                </div>
            </div>

            <!-- 2. 摸鱼日历卡片 (紧凑型防溢出) -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <div class="calendar-title">📅 摸鱼考勤历</div>
                    <div class="calendar-month-tag" id="calendarMonthTag">2026年7月</div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- 动态生成星期表头与各天日期 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束/结算弹窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <h2 id="modalTitle">🎉 顺利下班！</h2>
            <p id="modalDesc">今天摸鱼十分成功，薪水到手！</p>
            <div class="modal-stats">
                <div>获得了薪水：<strong id="finalMoney">￥0</strong></div>
                <div>摸鱼综合评分：<strong id="finalScore">S级</strong></div>
            </div>
            <button class="btn btn-primary" onclick="location.reload()">重新开启下一天</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
